
name: Build AutomaCut APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare HTML and logo
        shell: bash
        run: |
          set -euo pipefail

          HTML_FILE="$(find . -maxdepth 6 -type f -iname '*.html' \
            -not -path './.git/*' \
            -not -path './app/src/main/assets/*' \
            -print | head -n 1)"

          LOGO_FILE="$(find . -type f -name 'Untitled design (1).png' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No HTML file found. Upload your new AutomaCut HTML first."
            exit 1
          fi

          if [ -z "$LOGO_FILE" ]; then
            echo "ERROR: Untitled design (1).png was not found."
            exit 1
          fi

          echo "Using HTML: $HTML_FILE"
          echo "Using logo: $LOGO_FILE"

          sudo apt-get update
          sudo apt-get install -y imagemagick

          mkdir -p app/src/main/assets
          cp "$HTML_FILE" app/src/main/assets/index.html

          for item in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${item%%:*}"
            size="${item##*:}"
            mkdir -p "app/src/main/res/mipmap-$density"
            convert "$LOGO_FILE" -thumbnail "${size}x${size}" \
              -background white -gravity center -extent "${size}x${size}" \
              "app/src/main/res/mipmap-$density/ic_launcher.png"
          done

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/automacut/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutomaCut"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.automacut.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.automacut.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="AutomaCut"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/automacut/app/MainActivity.java <<'EOF'
          package com.automacut.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutomaCut-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

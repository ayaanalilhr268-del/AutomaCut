.lnk{color:var(--acc);font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);text-align:left;min-height:44px}

.hd{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;flex:none;font-size:16px}.sh button{font-size:12px;min-height:32px}
.tcard{width:132px;height:84px;border-radius:14px;flex:none;padding:10px;display:flex;align-items:flex-end;font-size:12px;font-weight:600;color:var(--on);text-align:left}
.gl{font-weight:800;font-size:18px;color:#4285F4}
.fs{display:flex;gap:12px;overflow-x:auto;flex:none;padding-bottom:4px}.fs button{flex:none}
.pv .fxl{position:absolute;inset:0;background:linear-gradient(160deg,#E0F2FE,#38BDF8 55%,#0369A1);overflow:hidden}
.fxl b{position:absolute;border-radius:50%;background:rgba(255,255,255,.55)}.fxl b:first-child{width:46%;aspect-ratio:1;left:14%;top:16%}.fxl b:last-child{width:26%;aspect-ratio:1;right:12%;bottom:24%;background:rgba(3,105,161,.6)}
.fx-mirror{transform:scaleX(-1)}.fx-slowzoom{animation:zin 6s ease-in-out infinite alternate}.fx-zoomout{animation:zin 6s ease-in-out infinite alternate-reverse}
.fx-zoompunch{animation:punch 1.5s ease-out infinite}.fx-beatpunch{animation:punch2 .5s ease-out infinite}.fx-pulse{animation:zin2 .8s ease-in-out infinite alternate}
.fx-shake{animation:shk .16s steps(2) infinite}.fx-wobble{animation:wob 4s ease-in-out infinite alternate}.fx-glitch{animation:gl 1.1s steps(1) infinite}
.fx-vhs{animation:vhs .4s steps(2) infinite;filter:saturate(.8) contrast(1.1)}.fx-flash{animation:fl 1s ease-out infinite}.fx-flicker{animation:fk .22s steps(2) infinite}.fx-dreamsoft{filter:brightness(1.08) contrast(.88) saturate(1.2)}
@keyframes zin{to{transform:scale(1.3)}}@keyframes zin2{to{transform:scale(1.06)}}@keyframes punch{0%{transform:scale(1.22)}60%,100%{transform:scale(1)}}@keyframes punch2{0%{transform:scale(1.1)}60%,100%{transform:scale(1)}}
@keyframes shk{0%{transform:translate(1.4%,-1%) scale(1.05)}100%{transform:translate(-1.4%,1%) scale(1.05)}}@keyframes wob{from{transform:translate(-3%,-2%) scale(1.08)}to{transform:translate(3%,2%) scale(1.08)}}
@keyframes gl{0%,70%,100%{transform:none;filter:none}72%{transform:translateX(8%);filter:hue-rotate(90deg) saturate(2)}76%{transform:translateX(-6%);filter:hue-rotate(-60deg)}80%{transform:none;filter:none}}
@keyframes vhs{0%{transform:translateX(.3%)}100%{transform:translateX(-.3%)}}@keyframes fl{0%{filter:brightness(1.8)}40%,100%{filter:brightness(1)}}@keyframes fk{0%{filter:brightness(.82)}100%{filter:brightness(1.1)}}
@media(prefers-reduced-motion:reduce){.pv .fxl{animation:none!important}}
#scr.full{padding:0;gap:0}

.e-tlw{height:236px;flex:none;position:relative;background:#101419;border-top:1px solid var(--line)}

welcome:()=>`<div class="sc" style="padding-top:8px;gap:18px"><div class="logo" style="height:64px;flex:none"><img src="${LOGO}" alt="AutomaCut" style="height:50px"></div><div style="position:relative;height:240px;flex:none"><div style="position:absolute;left:14%;top:30px;width:34%;height:190px;border-radius:20px;background:${G[3]};transform:rotate(-9deg);opacity:.85"></div><div style="position:absolute;right:14%;top:30px;width:34%;height:190px;border-radius:20px;background:${G[1]};transform:rotate(9deg);opacity:.85"></div><div style="position:absolute;left:50%;top:0;width:38%;height:220px;margin-left:-19%;border-radius:22px;background:${G[0]};box-shadow:0 16px 40px rgba(56,189,248,.35);display:flex;align-items:center;justify-content:center;color:var(--on)">${ic('play',44)}</div></div><div style="text-align:center"><h1 class="hd" style="font-size:28px">Edit like a pro,<br>right on your phone</h1><p class="mut" style="font-size:14px;line-height:1.5;margin:10px 0 0">Trim, add effects and export up to 4K. Your videos never leave your device.</p></div><div style="flex:1"></div>${gbtn('Continue with Google')}<button class="btn" data-go="signup">Create account with email</button><div style="text-align:center;font-size:14px;color:var(--mut)">Already have an account? <button class="lnk" style="min-height:36px" data-go="signin">Sign in</button></div><button style="color:var(--dim);font-size:13px;min-height:44px" data-act="guest">Continue as guest</button></div>`,
signin:()=>`<div class="top"><button class="ib" data-go="welcome" aria-label="Back" style="margin-left:-10px">${ic('back')}</button></div><div class="sc"><div><h1 class="hd">Welcome back</h1><p class="mut" style="margin:6px 0 0;font-size:14px">Sign in to continue editing.</p></div>${field('email','Email','email','you@example.com','email')}${field('pw','Password','password','Your password','current-password')}<div style="text-align:right;margin-top:-8px"><button class="lnk" style="font-size:13px;min-height:36px" data-act="forgot">Forgot password?</button></div><button class="btn" data-act="signin">Sign in</button><div class="div">or</div>${gbtn('Continue with Google')}<div style="text-align:center;font-size:14px;color:var(--mut)">New to AutomaCut? <button class="lnk" style="min-height:36px" data-go="signup">Create account</button></div><p style="font-size:11px;color:var(--dim);text-align:center;margin:0">Prototype: no real account is checked.</p></div>`,
signup:()=>`<div class="top"><button class="ib" data-go="welcome" aria-label="Back" style="margin-left:-10px">${ic('back')}</button></div><div class="sc"><div><h1 class="hd">Create your account</h1><p class="mut" style="margin:6px 0 0;font-size:14px">It only takes a minute.</p></div>${field('name','Name','text','Your name','name')}${field('email','Email','email','you@example.com','email')}${field('pw','Password','password','At least 8 characters','new-password')}<div id="pwm" style="margin-top:-8px">${meter()}</div><button class="chk ${S.terms?'on':''}" data-act="terms" role="checkbox" aria-checked="${S.terms}"><i>${S.terms?ic('check',14):''}</i><span>I agree to the Terms and Privacy Policy.<em id="e-terms" style="display:block;font-style:normal;font-size:12px;color:#F87171">${S.err.terms||''}</em></span></button><button class="btn" data-act="signup">Create account</button><div class="div">or</div>${gbtn('Sign up with Google')}<div style="text-align:center;font-size:14px;color:var(--mut)">Already have an account? <button class="lnk" style="min-height:36px" data-go="signin">Sign in</button></div><p style="font-size:11px;color:var(--dim);text-align:center;margin:0">Prototype: no real account is created.</p></div>`,
export:()=>`<div class="mid"><svg width="210" height="210" viewBox="0 0 210 210" role="img" aria-label="Export progress"><circle cx="105" cy="105" r="88" fill="none" stroke="#1D2630" stroke-width="12"/><circle id="ring" cx="105" cy="105" r="88" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-dasharray="${S.prog*5.53} 553" transform="rotate(-90 105 105)"/><text id="pct" x="105" y="118" text-anchor="middle" font-size="42" font-weight="700" fill="#F4F7FA" font-family="Sora,system-ui,sans-serif">${S.prog}%</text></svg><div style="font-size:20px;font-weight:600">Exporting your video</div><div class="mut" style="line-height:1.6;font-size:13px">${S.res} · ${S.fps} fps<br>Keep the app open while it renders</div></div><button class="btn ghost" style="height:52px;margin-bottom:24px" data-go="home">Cancel export</button>`,
done:()=>`<div class="mid"><div style="width:120px;height:120px;border-radius:60px;background:var(--acc);color:var(--on);display:flex;align-items:center;justify-content:center">${ic('check',56)}</div><div style="font-size:22px;font-weight:700">Saved to your gallery</div><div class="mut" style="line-height:1.6;font-size:13px">Movies/AutomaCut<br>${S.res} · ${S.fps} fps</div></div><button class="btn" style="height:52px" data-act="share">${ic('up',20)}Share</button><button class="btn ghost" style="height:52px;margin-bottom:24px" data-go="home">Back to home</button>`
};
function render(){$('#scr').innerHTML=SCR[S.screen]();const tl=$('#tl');if(tl&&S.playing)tl.scrollLeft=Math.max(0,S.t*S.zoom-tl.clientWidth/2)}
function go(s){if(s!==S.screen)S.err={};if(s==='editor'&&S.screen!=='editor'&&!S.keep)S.panel=null;clearInterval(tPlay);clearInterval(tExp);S.playing=false;S.screen=s;if(s==='export'){S.prog=0;tExp=setInterval(()=>{S.prog=Math.min(100,S.prog+2);const r=$('#ring');if(r){r.setAttribute('stroke-dasharray',S.prog*5.53+' 553');$('#pct').textContent=S.prog+'%'}if(S.prog>=100){clearInterval(tExp);go('done')}},120)}render()}
function upd(){const ph=$('#ph');if(!ph)return;ph.style.left=S.t*S.zoom+'px';$('#tm').textContent=fmt(S.t)+' / '+fmt(total());const tl=$('#tl');if(S.playing)tl.scrollLeft=Math.max(0,S.t*S.zoom-tl.clientWidth/2)}
const push=()=>{S.hist.push(JSON.stringify(S.clips));S.redo=[]};
const fix=()=>{if(!S.clips.find(c=>c.id===S.sel))S.sel=S.clips[0].id;S.t=Math.min(S.t,total())};
const A={
eff(a){S.effect=a;render()},fxtab(a){S.fxTab=a;render()},
eye(){S.show=!S.show;render()},terms(){S.terms=!S.terms;S.err.terms='';render()},
google(){S.user={name:'Alex Morgan',email:'alex.morgan@gmail.com',provider:'google'};go('home');toast('Prototype: the real app opens Google’s account picker here')},
guest(){S.user={name:'Guest',guest:true};go('home')},
signout(){S.user=null;S.f={name:'',email:'',pw:''};S.terms=false;go('welcome');toast('Signed out')},
forgot(){const e=S.f.email.trim();if(!emailOk(e)){S.err={email:'Enter your email first.'};render();return foc()}toast('A reset link would be sent to '+e)},
signin(){const e=S.f.email.trim();S.err={};if(!emailOk(e))S.err.email='Enter a valid email address.';if(!S.f.pw)S.err.pw='Enter your password.';if(S.err.email||S.err.pw){render();return foc()}const n=e.split('@')[0];S.user={name:n.charAt(0).toUpperCase()+n.slice(1),email:e,provider:'email'};S.f.pw='';go('home');toast('Signed in (prototype only)')},
signup(){const e=S.f.email.trim(),n=S.f.name.trim();S.err={};if(!n)S.err.name='Enter your name.';if(!emailOk(e))S.err.email='Enter a valid email address.';if(S.f.pw.length<8)S.err.pw='Use at least 8 characters.';if(!S.terms)S.err.terms='Please accept to continue.';if(Object.keys(S.err).length){render();return foc()}S.user={name:n,email:e,provider:'email'};S.f.pw='';go('home');toast('Account created (prototype only)')},
imp(){S.imp=true;go('new')},imp2(){S.imp=!S.imp;render()},asp(a){S.aspect=a;render()},res(a){S.res=a;render()},fps(a){S.fps=+a;render()},res2(){S.res=S.res==='1080p'?'720p':'1080p';render()},fps2(){S.fps=S.fps===30?60:30;render()},
cyc(){const k=Object.keys(AR);S.aspect=k[(k.indexOf(S.aspect)+1)%k.length];render()},chip(a){S.chip=a;render()},cat(a){S.cat=a;render()},tpl(a){S.tpl=a;go('new')},fil(a){S.filter=+a;render()},tg(a){S[a]=!S[a];render()},
tool(a){toast(a+' is part of the real app build — this prototype shows the layout')},share(){toast('The Android share sheet opens here on a real phone')},
zi(){S.zoom=Math.min(30,S.zoom+4);render()},zo(){S.zoom=Math.max(4,S.zoom-4);render()},
undo(){if(!S.hist.length)return toast('Nothing to undo');S.redo.push(JSON.stringify(S.clips));S.clips=JSON.parse(S.hist.pop());fix();render()},
redo(){if(!S.redo.length)return toast('Nothing to redo');S.hist.push(JSON.stringify(S.clips));S.clips=JSON.parse(S.redo.pop());fix();render()},
play(){if(S.playing){clearInterval(tPlay);S.playing=false}else{if(S.t>=total())S.t=0;S.playing=true;tPlay=setInterval(()=>{S.t=Math.min(total(),S.t+.1);upd();if(S.t>=total()){clearInterval(tPlay);S.playing=false;render()}},100)}$('#pp').innerHTML=ic(S.playing?'pause':'play',20)},
split(){let a=0;for(const c of S.clips){if(S.t>a+.3&&S.t<a+c.d-.3){push();const l={...c,d:+(S.t-a).toFixed(1)},r={...c,id:++uid,d:+(c.d-(S.t-a)).toFixed(1)};S.clips.splice(S.clips.indexOf(c),1,l,r);S.sel=r.id;render();return toast('Split at '+fmt(S.t))}a+=c.d}toast('Move the playhead inside a clip first')},
del(){if(S.clips.length<2)return toast('Keep at least one clip');push();S.clips=S.clips.filter(c=>c.id!==S.sel);fix();render();toast('Clip deleted')}
};
document.addEventListener('click',e=>{
const trk=e.target.closest('#trk');
if(trk){const r=trk.getBoundingClientRect();S.t=Math.max(0,Math.min(total(),(e.clientX-r.left)/S.zoom));const c=e.target.closest('[data-clip]');if(c){S.sel=+c.dataset.clip;render()}else upd();return}
const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a.dataset.a)});
document.addEventListener('input',e=>{const fl=e.target.dataset&&e.target.dataset.f;if(fl){S.f[fl]=e.target.value;if(S.err[fl]){S.err[fl]='';const m=$('#e-'+fl);if(m)m.textContent='';e.target.closest('.inp').classList.remove('bad')}if(fl==='pw'&&S.screen==='signup'){const w=$('#pwm');if(w)w.innerHTML=meter()}return}if(e.target.id==='inten'){S.inten=+e.target.value;$('#iv').textContent=S.inten;const i=$('.pv i');if(i)i.style.opacity=S.filter?S.inten/100*.85:0}});

function restore(j){const o=JSON.parse(j);S.clips=o.c;S.texts=o.t;S.audios=o.a;if(!S.clips.find(c=>c.id===S.sel))S.sel=S.clips[0].id;S.t=Math.min(S.t,total())}
const adjCSS=()=>`brightness(${1+S.adj.b/100}) contrast(${1+S.adj.c/100}) saturate(${1+S.adj.s/100})`;
const txtHTML=()=>S.texts.filter(x=>S.t>=x.start&&S.t<x.start+x.dur).map(x=>`<span style="color:${x.color}">${esc(x.text)}</span>`).join('');
function pvE(){const a=AR[S.aspect],land=a[0]>a[1],fx=S.effect&&S.effect!=='None'?' fx-'+slug(S.effect):'';return `<div class="e-pv" style="container-type:inline-size;aspect-ratio:${a[0]}/${a[1]};${land?'width:100%;max-height:100%':'height:100%;max-width:100%'}"><div class="e-scene${fx}"><img src="${CLOVER}" alt="" style="filter:${adjCSS()}">${S.flt!=='None'?`<img class="e-f" src="${CLOVER}" alt="" style="filter:${adjCSS()} ${FCSS[S.flt]};opacity:${S.inten/100}">`:''}</div><div class="e-txt" id="ptxt">${txtHTML()}</div></div>`}
function updTime(){const m=$('#tm1');if(m)m.textContent=fmtT(S.t);const p=$('#ptxt');if(p)p.innerHTML=txtHTML()}
function tlHTML(){const tot=total(),Z=S.zoom,W=tot*Z;const ticks=[];for(let i=0;i<=Math.ceil(tot);i++)ticks.push(i%2===0?`<span style="left:${i*Z}px">${fmtT(i)}</span>`:`<span style="left:${i*Z}px">·</span>`);
const clips=S.clips.map(c=>`<button class="e-clip${c.id===S.sel?' on':''}" data-clip="${c.id}" aria-label="Video clip" style="width:${c.d*Z}px"><div style="filter:hue-rotate(${c.g*40}deg)"></div></button>`).join('');
const au=S.audios.map(a=>`<div class="e-au ${a.kind}" style="left:${a.start*Z}px;width:${Math.max(28,a.dur*Z)}px">${ic('audio',14)}<span>${esc(a.name)}</span></div>`).join('');
const tx=S.texts.map(a=>`<div class="e-tx" style="left:${a.start*Z}px;width:${Math.max(28,a.dur*Z)}px"><span>${esc(a.text)}</span></div>`).join('');
return `<div class="e-tlw"><div class="e-tlh"><span><b id="tm1">${fmtT(S.t)}</b> <span style="color:var(--dim)">/ ${fmtT(tot)}</span></span><span style="display:flex;gap:2px"><button class="ib" style="width:40px;height:30px" data-act="zo" aria-label="Zoom out">${ic('zo',18)}</button><button class="ib" style="width:40px;height:30px" data-act="zi" aria-label="Zoom in">${ic('zi',18)}</button></span></div><div class="e-tl" id="tl2"><div class="e-wrap"><div class="e-pad"></div><div class="e-body" style="width:${W}px"><div class="e-rul">${ticks.join('')}</div><button class="e-mute" data-act="mute" aria-label="Mute original audio">${ic(S.mute?'mutei':'vol',22)}<span>${S.mute?'Unmute':'Mute clip'}</span></button><button class="e-cover" data-act="cover"><span>Cover</span></button><div class="e-vid">${clips}</div><button class="e-add" style="left:${W+10}px" data-act="addclip" aria-label="Add clip">${ic('plus',26)}</button><button class="e-sq" style="top:98px" data-act="openpanel" data-a="audio" aria-label="Audio">${ic('audio',20)}</button><button class="e-slot" style="top:98px;width:${W}px" data-act="openpanel" data-a="audio">${ic('plus',16)} Add audio</button>${au}<button class="e-sq" style="top:144px" data-act="openpanel" data-a="text" aria-label="Text">${ic('text',20)}</button><button class="e-slot" style="top:144px;width:${W}px" data-act="openpanel" data-a="text">${ic('plus',16)} Add text</button>${tx}</div><div class="e-pad"></div></div></div><div class="e-line"></div></div>`}
const head=(title,search)=>`<div class="e-ph">${search?`<label class="e-search">${ic('search',20)}<input data-q type="text" placeholder="${search}" value="${esc(S.fxq)}"></label>`:`<b style="flex:1;font-size:17px">${title}</b>`}<button class="e-ok" data-act="closepanel" aria-label="Done">${ic('check',26)}</button></div>`;
const cats=(list,cur,act)=>`<div class="e-cats">${list.map(c=>`<button class="e-cat${c===cur?' on':''}" data-act="${act}" data-a="${esc(c)}">${c}</button>`).join('')}</div>`;
function fxGrid(){const q=S.fxq.trim().toLowerCase();const list=q?['None',...EFFECTS.filter(e=>e!=='None'&&e.toLowerCase().includes(q))]:EFC[S.fxcat];return list.map(n=>`<button class="e-tile${S.effect===n?' on':''}" data-act="eff" data-a="${n}"><div class="e-th">${n==='None'?`<div class="e-none">${ic('none',34)}</div>`:`<div class="e-scene fx-${slug(n)}"><img src="${CLOVER}" alt=""></div>`}</div><span>${n}</span></button>`).join('')}
const fGrid=()=>FCAT[S.fcat].map(n=>`<button class="e-tile${S.flt===n?' on':''}" data-act="flt" data-a="${n}"><div class="e-th">${n==='None'?`<div class="e-none">${ic('none',34)}</div>`:`<img src="${CLOVER}" alt="" style="filter:${FCSS[n]}">`}</div><span>${n}</span></button>`).join('');
const etool=(i,l,act,a)=>`<button class="e-tool" data-act="${act}"${a!==undefined?` data-a="${a}"`:''}>${ic(i,24)}${l}</button>`;
function listA(){return S.audios.length?`<div style="font-size:12px;color:var(--dim)">On the timeline</div>`+S.audios.map(a=>`<div class="e-li">${ic('audio',18)}<span>${esc(a.name)}</span><em>${fmtT(a.start)} · ${a.dur.toFixed(1)}s</em><button class="ib" style="width:36px;height:36px" data-act="audel" data-a="${a.id}" aria-label="Remove">${ic('trash',18)}</button></div>`).join(''):''}
function panelHTML(){const p=S.panel;let h='';
if(p==='effects')h=head('','Search video effects')+cats(Object.keys(EFC),S.fxcat,'fxcat')+`<div class="e-grid" id="fxgrid">${fxGrid()}</div>`;
else if(p==='filters')h=head('Filters')+cats(Object.keys(FCAT),S.fcat,'fcat')+`<div class="e-grid">${fGrid()}</div>`+(S.flt!=='None'?`<div class="sl" style="padding:0 16px 14px;flex:none"><span style="width:64px">Intensity</span><input type="range" min="0" max="100" value="${S.inten}" id="inten" aria-label="Filter intensity"><span id="iv" style="width:28px;text-align:right;color:#fff">${S.inten}</span></div>`:'');
else if(p==='audio')h=head('Audio')+cats(['Music','Sound FX','Extract'],S.aud,'audtab')+`<div class="e-b2">`+(S.aud==='Music'?`<button class="btn" data-act="pickmusic">${ic('up',20)} Add audio from your device</button><div class="e-note"><b style="color:var(--txt)">About Spotify.</b> Spotify songs can’t be added to videos. Spotify’s rules don’t allow its music to be saved into other apps, so AutomaCut can’t link to it. Use your own audio files or the sound effects.</div>`:S.aud==='Sound FX'?SFX.map((f,i)=>`<div class="e-li"><button class="e-ci" data-act="sfxplay" data-a="${i}" aria-label="Play ${f[0]}">${ic('play',18)}</button><span>${f[0]}</span><em>${f[1]}s</em><button class="e-ci" data-act="sfxadd" data-a="${i}" aria-label="Add ${f[0]} at the playhead">${ic('plus',18)}</button></div>`).join(''):`<button class="btn" data-act="extract">${ic('audio',20)} Extract audio from the selected clip</button><div class="e-note">Pulls the sound out of the selected video clip onto the audio track.</div>`)+listA()+`</div>`;
else if(p==='text')h=head('Text')+`<div class="e-b2"><input class="e-inp" data-t placeholder="Type your text" value="${esc(S.tdraft)}"><div class="e-dots">${['#FFFFFF','#38BDF8','#FDE68A','#FDA4AF','#86EFAC','#C4B5FD'].map(c=>`<button class="${S.tcol===c?'on':''}" style="background:${c}" data-act="tcol" data-a="${c}" aria-label="Colour"></button>`).join('')}</div><button class="btn" data-act="addtext">${ic('plus',20)} Add text at ${fmtT(S.t)}</button>`+S.texts.map(x=>`<div class="e-li"><span style="color:${x.color}">${esc(x.text)}</span><em>${fmtT(x.start)} · ${x.dur}s</em><button class="ib" style="width:36px;height:36px" data-act="txdel" data-a="${x.id}" aria-label="Remove">${ic('trash',18)}</button></div>`).join('')+`</div>`;
else if(p==='edit')h=head('Edit')+`<div class="e-b2"><div style="display:flex;overflow-x:auto">${etool('cut','Split','split')}${etool('trim','Trim','tool','Trim')}${etool('dup','Duplicate','dupe')}${etool('back','Move left','mvl')}${etool('chev','Move right','mvr')}${etool('speed','Speed','tool','Speed')}${etool('trash','Delete','del')}</div><div class="e-note">Tap a clip on the timeline to select it. Scroll the timeline to move the playhead, then tap Split.</div></div>`;
else if(p==='adjust')h=head('Adjust')+`<div class="e-b2">${[['b','Brightness'],['c','Contrast'],['s','Saturation']].map(([k,l])=>`<div class="sl"><span style="width:84px">${l}</span><input type="range" min="-100" max="100" value="${S.adj[k]}" id="adj-${k}" aria-label="${l}"><span id="adv-${k}" style="width:32px;text-align:right;color:#fff">${S.adj[k]}</span></div>`).join('')}</div>`;
else if(p==='canvas')h=head('Canvas')+`<div class="e-b2"><div class="chips" style="flex-wrap:wrap">${Object.keys(AR).map(a=>`<button class="chip ${a===S.aspect?'on':''}" data-act="asp" data-a="${a}">${a}</button>`).join('')}</div></div>`;
else h=head(p==='overlay'?'Overlay':'Captions')+`<div class="e-b2"><div class="e-note">${p==='overlay'?'Put a picture or a second video on top of your clip.':'Add subtitles and captions to your video.'} This tool shows the layout only — it’s planned for a later version.</div></div>`;
return `<div class="e-panel">${h}</div>`}
const TOOLS=[['edit','cut','Edit'],['audio','audio','Audio'],['text','text','Text'],['effects','fx','Effects'],['filters','filters','Filters'],['adjust','tune','Adjust'],['overlay','layers','Overlay'],['captions','cc','Captions'],['canvas','aspect','Canvas']];
SCR.editor=()=>{if(S.full)return `<div class="e-prev" style="flex:1">${pvE()}<button class="e-fsx ib" data-act="full" aria-label="Exit full screen">${ic('close')}</button></div>`;
return `<div class="e-top"><button class="ib" data-go="home" aria-label="Close editor">${ic('close')}</button><button class="ib" data-act="opensearch" aria-label="Search effects">${ic('search')}</button><span style="flex:1"></span><button class="e-pill" data-act="qmenu" aria-haspopup="true" aria-expanded="${S.qmenu}">${S.res} ${ic('down',14)}</button><button class="e-exp" data-go="export">Export</button>${S.qmenu?`<div class="e-menu">`+['720p','1080p','4K'].map(q=>`<button class="${S.res===q?'on':''}" data-act="setq" data-a="${q}">${q==='4K'?'4K Ultra HD':q}${S.res===q?ic('check',16):''}</button>`).join('')+`</div>`:''}</div><div class="e-prev">${pvE()}</div><div class="e-ctl"><span style="justify-content:flex-start"><button class="ib" data-act="full" aria-label="Full screen preview">${ic('full')}</button></span><button class="ib" data-act="play" id="pp" aria-label="Play or pause">${ic(S.playing?'pause':'play',26)}</button><span><button class="ib" data-act="undo" aria-label="Undo">${ic('undo')}</button><button class="ib" data-act="redo" aria-label="Redo">${ic('redo')}</button></span></div>`+(S.panel?panelHTML():tlHTML()+`<div class="e-tb">`+TOOLS.map(([k,i,l])=>`<button data-act="openpanel" data-a="${k}">${ic(i,24)}${l}</button>`).join('')+`</div>`)};
function setupTl(){const tl=$('#tl2');if(!tl)return;const w=tl.clientWidth/2;tl.querySelectorAll('.e-pad').forEach(p=>p.style.width=w+'px');tl.scrollLeft=S.t*S.zoom}
function render(){const sc=$('#scr'),g=$('.e-grid'),gs=g?g.scrollTop:0;sc.className=S.screen==='editor'?'full':'';sc.innerHTML=SCR[S.screen]();const g2=$('.e-grid');if(g2)g2.scrollTop=gs;if(S.screen==='editor')setupTl()}
function updPv(){const im=document.querySelectorAll('.e-pv .e-scene img');if(im[0])im[0].style.filter=adjCSS();if(im[1])im[1].style.filter=adjCSS()+' '+FCSS[S.flt]}
Object.assign(A,{
openpanel(a){S.panel=a;S.keep=true;if(S.screen==='editor')render();else go('editor');S.keep=false},
closepanel(){S.panel=null;render()},
opensearch(){S.fxq='';A.openpanel('effects');setTimeout(()=>{const i=$('.e-search input');if(i)i.focus()},60)},
qmenu(){S.qmenu=!S.qmenu;render()},setq(q){S.res=q;S.qmenu=false;render()},full(){S.full=!S.full;render()},
fxcat(a){S.fxcat=a;render()},eff(a){S.effect=a;render()},fcat(a){S.fcat=a;render()},flt(a){S.flt=a;render()},audtab(a){S.aud=a;render()},
sfxplay(i){const c=ctxA();if(c.resume)c.resume();SFX[i][2](c)},
sfxadd(i){pushH();S.audios.push({id:++uid,name:SFX[i][0],start:+S.t.toFixed(1),dur:SFX[i][1],kind:'fx'});render();toast('Added “'+SFX[i][0]+'” at '+fmtT(S.t))},
audel(id){pushH();S.audios=S.audios.filter(a=>a.id!==+id);render()},
pickmusic(){$('#af').click()},
extract(){let st=0;for(const c of S.clips){if(c.id===S.sel){pushH();S.audios.push({id:++uid,name:'Audio from clip',start:st,dur:c.d,kind:'music'});render();return toast('Audio extracted')}st+=c.d}},
addtext(){const v=S.tdraft.trim();if(!v)return toast('Type some text first');pushH();S.texts.push({id:++uid,text:v,start:+S.t.toFixed(1),dur:3,color:S.tcol});S.tdraft='';render();updTime()},
txdel(id){pushH();S.texts=S.texts.filter(x=>x.id!==+id);render()},tcol(c){S.tcol=c;render()},
mute(){S.mute=!S.mute;render();toast(S.mute?'Original audio muted':'Original audio on')},
cover(){toast('Choose a cover frame — coming in the real app')},addclip(){toast('The real app opens your gallery here')},
zi(){S.zoom=Math.min(160,S.zoom*1.4);render()},zo(){S.zoom=Math.max(16,S.zoom/1.4);render()},
undo(){if(!S.hist.length)return toast('Nothing to undo');S.redo.push(snap());restore(S.hist.pop());render()},
redo(){if(!S.redo.length)return toast('Nothing to redo');S.hist.push(snap());restore(S.redo.pop());render()},
split(){let a=0;for(const c of S.clips){if(S.t>a+.3&&S.t<a+c.d-.3){pushH();const l={...c,d:+(S.t-a).toFixed(1)},r={...c,id:++uid,d:+(c.d-(S.t-a)).toFixed(1)};S.clips.splice(S.clips.indexOf(c),1,l,r);S.sel=r.id;render();return toast('Split at '+fmtT(S.t))}a+=c.d}toast('Move the playhead inside a clip first')},
del(){if(S.clips.length<2)return toast('Keep at least one clip');pushH();S.clips=S.clips.filter(c=>c.id!==S.sel);S.sel=S.clips[0].id;S.t=Math.min(S.t,total());render();toast('Clip deleted')},
dupe(){const i=S.clips.findIndex(c=>c.id===S.sel);if(i<0)return;pushH();S.clips.splice(i+1,0,{...S.clips[i],id:++uid});render();toast('Clip duplicated')},
mvl(){const i=S.clips.findIndex(c=>c.id===S.sel);if(i<1)return;pushH();S.clips.splice(i-1,0,S.clips.splice(i,1)[0]);render()},
mvr(){const i=S.clips.findIndex(c=>c.id===S.sel);if(i<0||i>=S.clips.length-1)return;pushH();S.clips.splice(i+1,0,S.clips.splice(i,1)[0]);render()},
play(){if(S.playing){clearInterval(tPlay);S.playing=false;render();return}if(S.t>=total()-.05)S.t=0;S.playing=true;render();tPlay=setInterval(()=>{S.t=Math.min(total(),S.t+.033);const tl=$('#tl2');if(tl)tl.scrollLeft=S.t*S.zoom;updTime();if(S.t>=total()){clearInterval(tPlay);S.playing=false;render()}},33)}
});
document.addEventListener('scroll',e=>{if(e.target.id==='tl2'&&!S.playing){S.t=Math.max(0,Math.min(total(),e.target.scrollLeft/S.zoom));updTime()}},true);
document.addEventListener('click',e=>{const c=e.target.closest('[data-clip]');if(c){S.sel=+c.dataset.clip;render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.q!==undefined){S.fxq=t.value;const g=$('#fxgrid');if(g)g.innerHTML=fxGrid();return}if(t.dataset&&t.dataset.t!==undefined){S.tdraft=t.value;return}if(t.id==='inten'){const f=$('.e-f');if(f)f.style.opacity=S.inten/100}if(t.id&&t.id.startsWith('adj-')){const k=t.id.slice(4);S.adj[k]=+t.value;const l=$('#adv-'+k);if(l)l.textContent=t.value;updPv()}});
$('#af').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const au=new Audio(URL.createObjectURL(f));au.onloadedmetadata=()=>{pushH();S.audios.push({id:++uid,name:f.name.replace(/\.[^.]+$/,''),start:+S.t.toFixed(1),dur:Math.min(isFinite(au.duration)?au.duration:10,Math.max(1,total()-S.t)),kind:'music'});render();toast('Audio added to the timeline')};au.onerror=()=>toast('That audio file isn’t supported.');e.target.value=''});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f){e.preventDefault();A[S.screen==='signup'?'signup':'signin']()}});
render();
</script>
</body>
</html>

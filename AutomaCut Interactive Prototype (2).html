<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutomaCut Interactive Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#05070D;--card:#0D1526;--bar:#091020;--line:#16233D;--line2:#26385E;--txt:#F2F2F5;--mut:#8FA3C4;--dim:#6F84A8;--acc:#2F6BFF;--cy:#22D3EE;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:'Sora',system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#app{position:relative;width:min(100vw,420px);height:min(100dvh,880px);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:460px){#app{border:1px solid var(--line);border-radius:32px}}
#scr{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 20px 0;gap:14px}
.logo{height:56px;flex:none;display:flex;align-items:center;justify-content:center}.logo img{height:44px;width:auto}
h1{margin:0;font-size:22px;flex:none}
.btn{height:50px;border-radius:15px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
.ghost{background:var(--card);border:1px solid var(--line2);color:var(--txt)}
.card{background:var(--card);border-radius:16px}
.mut{color:var(--mut);font-size:12px}
.nav{height:76px;flex:none;margin:0 -20px;background:var(--bar);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-bottom:8px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;min-width:64px;min-height:48px;color:var(--dim)}
.nav button.on{color:var(--acc)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:none}
.tool{height:76px;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px;text-align:left;width:100%}
.th{border-radius:12px;flex:none}
.chips{display:flex;gap:8px;flex:none;overflow-x:auto}
.chip{height:34px;padding:0 14px;border-radius:17px;font-size:12px;font-weight:600;background:var(--card);color:var(--mut);border:1px solid var(--line);flex:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;flex:1;min-height:0;overflow-y:auto;align-content:start;padding-bottom:12px}
.pc{display:flex;flex-direction:column;gap:8px;text-align:left}
.pc .t{height:150px;border-radius:16px;position:relative}
.pc .t b{position:absolute;right:8px;bottom:8px;background:rgba(5,7,13,.72);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:400}
.tp{height:220px;border-radius:18px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;text-align:left;font-weight:600;font-size:14px}
.tp span{margin-top:8px;height:32px;border-radius:10px;background:rgba(5,7,13,.6);display:flex;align-items:center;justify-content:center;font-size:12px;width:100%}
.set{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.set>*{min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:none}.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff}.sw.on{background:var(--acc)}.sw.on i{left:auto;right:3px}
.top{display:flex;align-items:center;gap:8px;height:48px;flex:none}.top .sp{flex:1}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.pvw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.pv{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#38BDF8,#2F6BFF 60%,#0A1A3F);display:flex;align-items:flex-end;justify-content:center}
.pv i{position:absolute;inset:0}.pv span{position:relative;margin-bottom:12%;font-weight:700;font-size:18px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.ctl{display:flex;align-items:center;justify-content:space-between;flex:none;height:48px}
.tl{flex:none;height:150px;margin:0 -20px;background:var(--bar);border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;position:relative}
.trk{position:relative;height:100%;margin-left:20px;cursor:pointer}
.rul{position:relative;height:22px;font-size:10px;color:var(--dim)}.rul span{position:absolute;top:6px}
.vt{position:absolute;top:28px;height:52px;left:0;right:0}
.clip{position:absolute;top:0;height:52px;border-radius:8px;border:2px solid transparent}.clip.on{border-color:#fff}
.tx{position:absolute;top:88px;left:30px;width:110px;height:22px;border-radius:6px;background:#1A3A7A;font-size:11px;display:flex;align-items:center;padding:0 8px}
.au{position:absolute;top:118px;left:0;height:22px;background:repeating-linear-gradient(90deg,var(--cy) 0 2px,transparent 2px 5px);opacity:.75;border-radius:4px}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);pointer-events:none}.ph:before{content:"";position:absolute;top:0;left:-5px;width:12px;height:12px;border-radius:6px;background:var(--acc)}
.tb{height:76px;flex:none;margin:0 -20px;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-bottom:6px}
.tb button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;min-width:52px;min-height:48px;color:#D6E2FF}
.fs{display:flex;justify-content:space-between;flex:none}.fs button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mut)}.fs button.on{color:#fff}
.fs i{width:60px;height:60px;border-radius:14px;border:2px solid transparent;display:block}.fs .on i{border-color:var(--acc)}
.sl{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--mut);flex:none}.sl input{flex:1;accent-color:var(--acc);height:32px}
.tabs{display:flex;gap:24px;font-size:14px;font-weight:600;flex:none}.tabs button{color:var(--dim);padding-bottom:6px}.tabs .on{color:#fff;border-bottom:2px solid var(--acc)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#16233D;border:1px solid var(--line2);border-radius:12px;padding:10px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"><div id="scr"></div><div id="toast" role="status"></div></div>

const pv=()=>{const a=AR[S.aspect],f=FIL[S.filter],land=a[0]>a[1];return `<div class="pv" style="aspect-ratio:${a[0]}/${a[1]};${land?'width:100%;max-height:100%':'height:100%;max-width:100%'}"><i style="background:linear-gradient(135deg,${f[1]},${f[2]});opacity:${S.filter?S.inten/100*.85:0}"></i><span>Your text here</span></div>`};
const SCR={
home:()=>logo()+`<div class="card" style="flex:none;padding:22px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(135deg,#0A1A3F,#0D1526 70%);border:1px solid var(--line)"><div style="font-size:20px;font-weight:600">Start a new cut</div><div class="mut" style="line-height:1.5;font-size:13px">Trim, split and export videos right on your phone.</div><div style="display:flex;gap:10px"><button class="btn" style="flex:1" data-go="new">+ New Project</button><button class="btn ghost" style="padding:0 16px;font-size:14px" data-act="imp">Import</button></div></div><div class="tools"><button class="tool" data-go="editor">${ic('cut')}Edit</button><button class="tool" data-go="filters">${ic('filters')}Filters</button><button class="tool" data-act="tool" data-a="Text">${ic('text')}Text</button><button class="tool" data-act="tool" data-a="Audio">${ic('audio')}Audio</button></div><div style="display:flex;justify-content:space-between;align-items:baseline;flex:none"><b style="font-size:16px">Recent projects</b><button style="font-size:12px;color:var(--acc)" data-go="projects">See all</button></div><div style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow-y:auto">`+PROJ.slice(0,3).map(p=>`<button class="row" data-go="editor"><div class="th" style="width:64px;height:64px;background:${G[p[3]]}"></div><div><div style="font-size:14px;font-weight:600">${p[0]}</div><div class="mut" style="margin-top:4px">Edited ${p[2].toLowerCase()} · ${p[1]}</div></div></button>`).join('')+'</div>'+nav('home'),
new:()=>`<div class="top"><button class="ib" data-go="home" aria-label="Back" style="margin-left:-10px">${ic('back')}</button><b style="font-size:18px">New project</b></div>`+(S.tpl?`<div class="mut" style="flex:none;color:var(--cy)">Template: ${S.tpl}</div>`:'')+`<div class="card" style="height:232px;flex:none;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"><div style="${S.aspect==='16:9'?'width:224px;height:126px':S.aspect==='1:1'?'width:160px;height:160px':S.aspect==='4:5'?'width:144px;height:180px':'width:108px;height:192px'};border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:${S.imp?'linear-gradient(160deg,#38BDF8,#2F6BFF 60%,#0A1A3F)':'var(--card)'};border:${S.imp?0:'1.5px dashed var(--line2)'}">${S.aspect}</div><div class="mut">${S.aspect} · ${S.res} · ${S.fps} fps</div></div>`+(S.imp?`<button class="row" style="border:1px solid var(--acc);background:#0A1A3F;flex:none" data-act="imp2"><div class="th" style="width:36px;height:36px;background:${G[0]}"></div><div><div style="font-size:14px;font-weight:600">Sample clip.mp4</div><div class="mut" style="margin-top:3px">0:48 · tap to remove</div></div></button>`:`<button class="btn ghost" style="height:64px;border:1.5px dashed var(--line2);flex:none" data-act="imp2">${ic('up')}Import video from gallery</button>`)+`<div style="flex:none"><div class="mut" style="font-size:13px;margin-bottom:8px">Aspect ratio</div><div style="display:flex;gap:8px">`+Object.keys(AR).map(a=>`<button class="chip ${a===S.aspect?'on':''}" style="flex:1;height:44px;border-radius:12px" data-act="asp" data-a="${a}">${a}</button>`).join('')+`</div></div><div style="flex:none"><div class="mut" style="font-size:13px;margin-bottom:8px">Export quality</div><div style="display:flex;gap:8px">`+['720p','1080p'].map(r=>`<button class="chip ${r===S.res?'on':''}" style="flex:1;height:44px;border-radius:12px" data-act="res" data-a="${r}">${r}</button>`).join('')+[30,60].map(f=>`<button class="chip ${f===S.fps?'on':''}" style="flex:1;height:44px;border-radius:12px" data-act="fps" data-a="${f}">${f} fps</button>`).join('')+`</div></div><div style="flex:1"></div><button class="btn" style="height:52px;margin-bottom:24px" data-go="editor">Start editing</button>`,
editor:()=>{let x=0;const tot=total(),clips=S.clips.map(c=>{const e=`<button class="clip ${c.id===S.sel?'on':''}" data-clip="${c.id}" aria-label="Clip ${c.id}" style="left:${x}px;width:${c.d*S.zoom-2}px;background:${G[c.g]}"></button>`;x+=c.d*S.zoom;return e}).join(''),ticks=Array.from({length:Math.floor(tot/5)+1},(_,i)=>`<span style="left:${i*5*S.zoom}px">${i*5}s</span>`).join('');
return `<div class="top"><button class="ib" data-go="home" aria-label="Close" style="margin-left:-10px">${ic('close')}</button><b style="font-size:14px">Untitled cut</b><span class="sp"></span><button class="chip" style="height:36px;border-radius:10px" data-act="cyc" aria-label="Change aspect ratio">${S.aspect}</button><button class="btn" style="height:36px;padding:0 16px;border-radius:10px;font-size:13px" data-go="export">Export</button></div><div class="pvw">${pv()}</div><div class="ctl"><button class="ib" data-act="undo" aria-label="Undo">${ic('undo')}</button><button class="ib" data-act="redo" aria-label="Redo">${ic('redo')}</button><button class="ib" data-act="play" aria-label="Play or pause" style="background:#F2F2F5;color:#05070D;border-radius:22px" id="pp">${ic(S.playing?'pause':'play',20)}</button><span class="mut" id="tm">${fmt(S.t)} / ${fmt(tot)}</span><button class="ib" data-act="zo" aria-label="Zoom out">${ic('zo')}</button><button class="ib" data-act="zi" aria-label="Zoom in">${ic('zi')}</button></div><div class="tl" id="tl"><div class="trk" id="trk" style="width:${tot*S.zoom+60}px"><div class="rul">${ticks}</div><div class="vt">${clips}</div><div class="tx">Your text here</div><div class="au" style="width:${tot*S.zoom}px"></div><div class="ph" id="ph" style="left:${S.t*S.zoom}px"></div></div></div><div class="tb"><button data-act="tool" data-a="Trim">${ic('trim')}Trim</button><button data-act="split">${ic('cut')}Split</button><button data-go="filters">${ic('filters')}Filters</button><button data-act="tool" data-a="Text">${ic('text')}Text</button><button data-act="tool" data-a="Audio">${ic('audio')}Audio</button><button data-act="del">${ic('trash')}Delete</button></div>`},
filters:()=>`<div class="top"><button class="ib" data-go="editor" aria-label="Close" style="margin-left:-10px">${ic('close')}</button><b class="sp" style="text-align:center;font-size:15px">Filters</b><button class="btn" style="height:36px;padding:0 16px;border-radius:10px;font-size:13px" data-go="editor">Done</button></div><div class="pvw">${pv()}</div><div class="tabs"><button class="on">Filters</button><button data-act="tool" data-a="Adjust">Adjust</button><button data-act="tool" data-a="Fade">Fade</button></div><div class="fs">`+FIL.map((f,i)=>`<button class="${i===S.filter?'on':''}" data-act="fil" data-a="${i}"><i style="background:linear-gradient(135deg,${f[1]},${f[2]})"></i>${f[0]}</button>`).join('')+`</div><div class="sl" style="margin-bottom:28px"><span style="width:64px">Intensity</span><input type="range" min="0" max="100" value="${S.inten}" id="inten" aria-label="Filter intensity"><span id="iv" style="width:28px;text-align:right;color:#fff">${S.inten}</span></div>`,
projects:()=>logo()+'<h1>Projects</h1><div class="card" style="height:44px;flex:none;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--dim);font-size:13px">'+ic('search',18)+'Search projects</div>'+chips(['All','Recent','Drafts'],S.chip,'chip')+'<div class="grid">'+PROJ.filter(p=>S.chip==='All'||(S.chip==='Recent'?p[4]==='r':p[4]==='d')).map(p=>`<button class="pc" data-go="editor"><div class="t" style="background:${G[p[3]]}"><b>${p[1]}</b></div><div><div style="font-size:13px;font-weight:600">${p[0]}</div><div class="mut" style="font-size:11px;margin-top:2px">${p[2]}</div></div></button>`).join('')+'</div>'+nav('projects'),
templates:()=>logo()+'<h1>Templates</h1>'+chips(['Trending','Vlog','Travel','Beat sync'],S.cat,'cat')+'<div class="grid" style="gap:12px">'+TPL.filter(t=>S.cat==='Trending'||t[1]===S.cat).map((t,i)=>`<button class="tp" style="background:${G[i+2]}" data-act="tpl" data-a="${t[0]}">${t[0]}<span>Use template</span></button>`).join('')+'</div>'+nav('templates'),
settings:()=>logo()+'<h1>Settings</h1><div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px"><div><div class="mut" style="margin:0 4px 8px;color:var(--dim)">Export</div><div class="set"><button data-act="res2">Default resolution<span class="mut" style="font-size:13px">'+S.res+'</span></button><button data-act="fps2">Default frame rate<span class="mut" style="font-size:13px">'+S.fps+' fps</span></button><div>Save exports to<span class="mut" style="font-size:13px">Movies/AutomaCut</span></div></div></div><div><div class="mut" style="margin:0 4px 8px;color:var(--dim)">Editor</div><div class="set"><div>Theme<span class="mut" style="font-size:13px">Dark blue</span></div><button data-act="tg" data-a="grid">Show grid on preview<span class="sw '+(S.grid?'on':'')+'"><i></i></span></button><button data-act="tg" data-a="auto">Auto-save projects<span class="sw '+(S.auto?'on':'')+'"><i></i></span></button></div></div><div><div class="mut" style="margin:0 4px 8px;color:var(--dim)">About</div><div class="set"><div>Privacy<span class="mut" style="font-size:12px">Everything stays on your phone</span></div><div>Version<span class="mut" style="font-size:13px">0.1</span></div></div></div></div>'+nav('settings'),
export:()=>`<div class="mid"><svg width="210" height="210" viewBox="0 0 210 210" role="img" aria-label="Export progress"><circle cx="105" cy="105" r="88" fill="none" stroke="#16233D" stroke-width="12"/><circle id="ring" cx="105" cy="105" r="88" fill="none" stroke="#2F6BFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="${S.prog*5.53} 553" transform="rotate(-90 105 105)"/><text id="pct" x="105" y="118" text-anchor="middle" font-size="42" font-weight="700" fill="#F2F2F5" font-family="Sora,system-ui,sans-serif">${S.prog}%</text></svg><div style="font-size:20px;font-weight:600">Exporting your video</div><div class="mut" style="line-height:1.6;font-size:13px">${S.res} · ${S.fps} fps<br>Keep the app open while it renders</div></div><button class="btn ghost" style="height:52px;margin-bottom:24px" data-go="home">Cancel export</button>`,
done:()=>`<div class="mid"><div style="width:120px;height:120px;border-radius:60px;background:var(--acc);display:flex;align-items:center;justify-content:center">${ic('check',56)}</div><div style="font-size:22px;font-weight:700">Saved to your gallery</div><div class="mut" style="line-height:1.6;font-size:13px">Movies/AutomaCut<br>${S.res} · ${S.fps} fps</div></div><button class="btn" style="height:52px" data-act="share">${ic('up',20)}Share</button><button class="btn ghost" style="height:52px;margin-bottom:24px" data-go="home">Back to home</button>`
};
function render(){const old=$('#tl'),keep=old?old.scrollLeft:0;$('#scr').innerHTML=SCR[S.screen]();const tl=$('#tl');if(tl)tl.scrollLeft=S.playing?Math.max(0,S.t*S.zoom-tl.clientWidth/2):keep}
function go(s){clearInterval(tPlay);clearInterval(tExp);S.playing=false;S.screen=s;if(s==='export'){S.prog=0;tExp=setInterval(()=>{S.prog=Math.min(100,S.prog+2);const r=$('#ring');if(r){r.setAttribute('stroke-dasharray',S.prog*5.53+' 553');$('#pct').textContent=S.prog+'%'}if(S.prog>=100){clearInterval(tExp);go('done')}},120)}render()}
function upd(){const ph=$('#ph');if(!ph)return;ph.style.left=S.t*S.zoom+'px';$('#tm').textContent=fmt(S.t)+' / '+fmt(total());const tl=$('#tl');if(S.playing)tl.scrollLeft=Math.max(0,S.t*S.zoom-tl.clientWidth/2)}
const push=()=>{S.hist.push(JSON.stringify(S.clips));S.redo=[]};
const fix=()=>{if(!S.clips.find(c=>c.id===S.sel))S.sel=S.clips[0].id;S.t=Math.min(S.t,total())};
const A={
imp(){S.imp=true;go('new')},imp2(){S.imp=!S.imp;render()},asp(a){S.aspect=a;render()},res(a){S.res=a;render()},fps(a){S.fps=+a;render()},res2(){S.res=S.res==='1080p'?'720p':'1080p';render()},fps2(){S.fps=S.fps===30?60:30;render()},
cyc(){const k=Object.keys(AR);S.aspect=k[(k.indexOf(S.aspect)+1)%k.length];render()},chip(a){S.chip=a;render()},cat(a){S.cat=a;render()},tpl(a){S.tpl=a;go('new')},fil(a){S.filter=+a;render()},tg(a){S[a]=!S[a];render()},
tool(a){toast(a+' is part of the real app build — this prototype shows the layout')},share(){toast('The Android share sheet opens here on a real phone')},
zi(){S.zoom=Math.min(30,S.zoom+4);render()},zo(){S.zoom=Math.max(4,S.zoom-4);render()},
undo(){if(!S.hist.length)return toast('Nothing to undo');S.redo.push(JSON.stringify(S.clips));S.clips=JSON.parse(S.hist.pop());fix();render()},
redo(){if(!S.redo.length)return toast('Nothing to redo');S.hist.push(JSON.stringify(S.clips));S.clips=JSON.parse(S.redo.pop());fix();render()},
play(){if(S.playing){clearInterval(tPlay);S.playing=false}else{if(S.t>=total())S.t=0;S.playing=true;tPlay=setInterval(()=>{S.t=Math.min(total(),S.t+.1);upd();if(S.t>=total()){clearInterval(tPlay);S.playing=false;render()}},100)}$('#pp').innerHTML=ic(S.playing?'pause':'play',20)},
split(){let a=0;for(const c of S.clips){if(S.t>a+.3&&S.t<a+c.d-.3){push();const l={...c,d:+(S.t-a).toFixed(1)},r={...c,id:++uid,d:+(c.d-(S.t-a)).toFixed(1)};S.clips.splice(S.clips.indexOf(c),1,l,r);S.sel=r.id;render();return toast('Split at '+fmt(S.t))}a+=c.d}toast('Move the playhead inside a clip first')},
del(){if(S.clips.length<2)return toast('Keep at least one clip');push();S.clips=S.clips.filter(c=>c.id!==S.sel);fix();render();toast('Clip deleted')}
};
document.addEventListener('click',e=>{
const trk=e.target.closest('#trk');
if(trk){const r=trk.getBoundingClientRect();S.t=Math.max(0,Math.min(total(),(e.clientX-r.left)/S.zoom));const c=e.target.closest('[data-clip]');if(c){S.sel=+c.dataset.clip;render()}else upd();return}
const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a.dataset.a)});
document.addEventListener('input',e=>{if(e.target.id==='inten'){S.inten=+e.target.value;$('#iv').textContent=S.inten;const i=$('.pv i');if(i)i.style.opacity=S.filter?S.inten/100*.85:0}});
render();
</script>
</body>
</html>
